# Pack-wide presets for the flyer: the order deadline and the product list.
#
# `updated` is the rollout date for everything in this file. Each visitor's
# browser remembers the `updated` value that was in effect the last time these
# presets were applied to it. When the date below is NEWER than that, their
# order-by date and product list are replaced with these on their next visit —
# so bump it whenever the deadline, prices or products change for a new season.
# Leave it alone for typo fixes you don't want pushed over everyone's edits.

updated: 2026-09-15

# Printed on the flyer as "Order by <this>". Free text, so write it the way it
# should read on paper. A scout can still change it on their own flyer.
order_by: October 31st

# Where a Scout's online store lives. Typing just the 8-digit Scout code into
# the flyer expands to this plus the code.
store_base: https://trails-end.com/store/scout/

# One `- name: ... / price: ...` pair per product. Six fit the flyer's
# two-column grid neatly; more will still render but will crowd the page.
products:
  - name: Salted Caramel Corn
    price: $20
  - name: White Cheddar
    price: $20
  - name: Sweet & Salty Kettle Corn
    price: $20
  - name: Microwave Butter Popcorn
    price: $27
  - name: Dark Chocolatey Salted Caramels
    price: $37
  - name: Helpers & Heroes Donation
    price: $5 and up
